<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">5D Discount Decision Path</title><desc id="desc">Define, decide, document, deliver and double-check post-sale discounts.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:19px;letter-spacing:4px;font-weight:bold;fill:#d6b563}.title{font-size:47px;font-weight:bold;fill:#fffaf0}.sub{font-size:22px;fill:#d8e2ec}.num{font-size:31px;font-weight:bold;fill:#b68224}.label{font-weight:bold;fill:#061a33}.detail{font-size:15.5px;fill:#324357}.footer{font-size:18px;fill:#d8e2ec}</style><rect width="1200" height="675" fill="#061a33"/><path d="M40 55h95" stroke="#c79a42" stroke-width="5"/><text x="40" y="107" class="eyebrow">SHIKHA SOLUTIONS · FOUNDER INSIGHT</text><text x="40" y="166" class="title">Before you promise a discount,</text><text x="40" y="224" class="title">make the decision visible.</text><g transform="translate(40,257)"><rect width="208" height="248" rx="16" fill="#fffaf0" stroke="#d5c8aa" stroke-width="2"/><text x="20" y="48" class="num">01</text><path d="M20 65h168" stroke="#d0a34c" stroke-width="3"/><text x="20" y="108" class="label" font-size="23">DEFINE</text><text x="20" y="154" class="detail">Which sale?</text><text x="20" y="189" class="detail">Reason + amount</text></g><g transform="translate(266,257)"><rect width="208" height="248" rx="16" fill="#fffaf0" stroke="#d5c8aa" stroke-width="2"/><text x="20" y="48" class="num">02</text><path d="M20 65h168" stroke="#d0a34c" stroke-width="3"/><text x="20" y="108" class="label" font-size="23">DECIDE</text><text x="20" y="154" class="detail">What margin remains?</text><text x="20" y="189" class="detail">Named approver</text></g><g transform="translate(492,257)"><rect width="208" height="248" rx="16" fill="#fffaf0" stroke="#d5c8aa" stroke-width="2"/><text x="20" y="48" class="num">03</text><path d="M20 65h168" stroke="#d0a34c" stroke-width="3"/><text x="20" y="108" class="label" font-size="23">DOCUMENT</text><text x="20" y="154" class="detail">What was agreed?</text><text x="20" y="189" class="detail">Accounts review</text></g><g transform="translate(718,257)"><rect width="208" height="248" rx="16" fill="#fffaf0" stroke="#d5c8aa" stroke-width="2"/><text x="20" y="48" class="num">04</text><path d="M20 65h168" stroke="#d0a34c" stroke-width="3"/><text x="20" y="108" class="label" font-size="23">DELIVER</text><text x="20" y="154" class="detail">What does buyer receive?</text><text x="20" y="189" class="detail">Clear adjustment</text></g><g transform="translate(944,257)"><rect width="208" height="248" rx="16" fill="#fffaf0" stroke="#d5c8aa" stroke-width="2"/><text x="20" y="48" class="num">05</text><path d="M20 65h168" stroke="#d0a34c" stroke-width="3"/><text x="20" y="108" class="label" font-size="19">DOUBLE-CHECK</text><text x="20" y="154" class="detail">Do records match?</text><text x="20" y="189" class="detail">Reconcile weekly</text></g><text x="40" y="579" class="footer">Sales promise  →  Margin check  →  Accountable approval  →  Accurate records</text><path d="M40 606h1120" stroke="#ab8e55" opacity=".6"/><text x="40" y="640" class="footer">The 5D Discount Decision Path · shikhasolutions.com</text></svg>