<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
<pattern id="linen" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0V10" stroke="#9b6e46" stroke-opacity=".13" stroke-width="1"/></pattern>
