<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Shikha Solutions 4P Payment-Margin Check</title>
  <desc id="desc">Four steps: Profile, Payment Mix, Profit Impact and Payment Playbook.</desc>
  <rect width="1200" height="675" fill="#F7F3EC"/>
  <rect x="0" y="0" width="1200" height="18" fill="#C98A16"/>
  <text x="600" y="92" text-anchor="middle" fill="#061A33" font-family="Georgia, serif" font-size="42" font-weight="700">The 4P Payment-Margin Check</text>
  <text x="600" y="130" text-anchor="middle" fill="#5D6873" font-family="Arial, sans-serif" font-size="20">Know the cost before it appears in your settlement</text>
  <line x1="145" y1="328" x2="1055" y2="328" stroke="#C98A16" stroke-width="5"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(180 328)">
      <circle r="76" fill="#061A33" stroke="#C98A16" stroke-width="5"/>
      <text y="14" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="700">1</text>
      <text y="126" text-anchor="middle" fill="#061A33" font-size="27" font-weight="700">PROFILE</text>
      <text y="160" text-anchor="middle" fill="#5D6873" font-size="18">Confirm merchant category</text>
    </g>
    <g transform="translate(460 328)">
      <circle r="76" fill="#061A33" stroke="#C98A16" stroke-width="5"/>
      <text y="14" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="700">2</text>
      <text y="126" text-anchor="middle" fill="#061A33" font-size="27" font-weight="700">PAYMENT MIX</text>
      <text y="160" text-anchor="middle" fill="#5D6873" font-size="18">Measure exposed transactions</text>
    </g>
    <g transform="translate(740 328)">
      <circle r="76" fill="#061A33" stroke="#C98A16" stroke-width="5"/>
      <text y="14" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="700">3</text>
      <text y="126" text-anchor="middle" fill="#061A33" font-size="27" font-weight="700">PROFIT IMPACT</text>
      <text y="160" text-anchor="middle" fill="#5D6873" font-size="18">Test margin by product</text>
    </g>
    <g transform="translate(1020 328)">
      <circle r="76" fill="#061A33" stroke="#C98A16" stroke-width="5"/>
      <text y="14" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="700">4</text>
      <text y="126" text-anchor="middle" fill="#061A33" font-size="27" font-weight="700">PLAYBOOK</text>
      <text y="160" text-anchor="middle" fill="#5D6873" font-size="18">Give the team one rule</text>
    </g>
  </g>
  <rect x="150" y="565" width="900" height="66" rx="8" fill="#061A33"/>
  <text x="600" y="607" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700">Measure first. Protect margin. Keep payment easy for the customer.</text>
</svg>
