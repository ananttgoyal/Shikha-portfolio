name: Reorder homepage sections
on:
  push:
    paths:
      - '.github/workflows/reorder-home-sections.yml'
permissions:
  contents: write
jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reorder homepage sections
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'index.html';
          let s = fs.readFileSync(p, 'utf8');

          const assessmentStart = s.indexOf('<section class="section"><div class="container assessment">');
          const proofStart = s.indexOf('<section class="section alt"><div class="container"><div class="section-head reveal"><div class="kicker">Execution experience</div>', assessmentStart);
          const checklistStart = s.indexOf('<section id="checklist"', proofStart);
          const founderStart = s.indexOf('<section id="founder"', checklistStart);
          const behindWorkStart = s.indexOf('<section class="section alt"><div class="container"><div class="section-head reveal"><div class="kicker">Behind the work</div>', founderStart);

          if ([assessmentStart, proofStart, checklistStart, founderStart, behindWorkStart].some(i => i < 0)) {
            throw new Error('Could not locate one or more homepage sections');
          }

          const before = s.slice(0, assessmentStart);
          const assessment = s.slice(assessmentStart, proofStart);
          const proof = s.slice(proofStart, checklistStart);
          const checklist = s.slice(checklistStart, founderStart);
          const founder = s.slice(founderStart, behindWorkStart);
          const after = s.slice(behindWorkStart);

          s = before + assessment + checklist + founder + proof + after;
          fs.writeFileSync(p, s);
          NODE
      - name: Remove one-time workflow
        run: rm .github/workflows/reorder-home-sections.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/reorder-home-sections.yml
          git commit -m "Reorder assessment checklist founder and proof sections"
          git push origin main