<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 940" role="img" aria-label="Warm private founders roundtable with acoustic guitar and lounge seating">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset=".52" stop-color="#f5e6d1"/><stop offset="1" stop-color="#d6ab76"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dcb58a"/><stop offset="1" stop-color="#aa7e58"/></linearGradient>
<linearGradient id="wood" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#b77742"/><stop offset=".45" stop-color="#704522"/><stop offset="1" stop-color="#432b20"/></linearGradient>
