name: Remove final CTA section

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove repeated final CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start = s.find('<section class="final-cta">')
          end = s.find('<section class="section alt">', start)
          if start == -1 or end == -1:
              raise SystemExit('Final CTA section markers not found')
          p.write_text(s[:start] + s[end:])
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/remove-final-cta.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-final-cta.yml
          git commit -m "Remove repeated final homepage CTA"
          git push
