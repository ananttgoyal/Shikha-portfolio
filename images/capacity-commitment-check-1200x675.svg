<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#faf6ee"/><rect width="1200" height="20" fill="#c99428"/><text x="65" y="94" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#071b36">CAPACITY COMMITMENT CHECK</text><text x="65" y="140" font-family="Arial,sans-serif" font-size="25" fill="#596676">Four questions before you hire or promise faster delivery</text><g font-family="Arial,sans-serif"><rect x="60" y="190" width="525" height="170" rx="18" fill="#071b36"/><text x="88" y="243" font-size="31" font-weight="700" fill="#d4ab58">01  DEMAND</text><text x="88" y="290" font-size="25" fill="#fff">Are orders confirmed and recurring?</text><rect x="615" y="190" width="525" height="170" rx="18" fill="#071b36"/><text x="643" y="243" font-size="31" font-weight="700" fill="#d4ab58">02  CONSTRAINT</text><text x="643" y="290" font-size="25" fill="#fff">At which stage does work wait?</text><rect x="60" y="385" width="525" height="170" rx="18" fill="#071b36"/><text x="88" y="438" font-size="31" font-weight="700" fill="#d4ab58">03  CASH</text><text x="88" y="485" font-size="25" fill="#fff">What must be paid before collection?</text><rect x="615" y="385" width="525" height="170" rx="18" fill="#071b36"/><text x="643" y="438" font-size="31" font-weight="700" fill="#d4ab58">04  OWNERSHIP</text><text x="643" y="485" font-size="25" fill="#fff">Who coordinates and decides?</text></g><text x="65" y="622" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#071b36">ONE CONSTRAINT. ONE OWNER. ONE TWO-WEEK REVIEW.</text></svg>