<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">India's MSME milestone: 10 crore registrations</title><desc id="desc">An editorial graphic showing registrations growing from 1.02 crore in 2020 to more than 10 crore in October 2026, with 37.8 percent women-led registrations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101e35"/><stop offset="1" stop-color="#1d3555"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c49a54"/><stop offset="1" stop-color="#e8c783"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1050" cy="100" r="230" fill="#fff" opacity=".035"/><circle cx="1050" cy="100" r="160" fill="none" stroke="#d8b36d" stroke-opacity=".22" stroke-width="2"/><text x="78" y="88" fill="#d8b36d" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">INDIA'S MSME MOMENT</text><text x="78" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="78" font-weight="700">10 CRORE+</text><text x="82" y="238" fill="#d9e2ee" font-family="Arial,sans-serif" font-size="29">Combined Udyam + Udyam Assist registrations</text><rect x="80" y="294" width="1040" height="2" fill="#fff" opacity=".18"/><text x="82" y="365" fill="#d8b36d" font-family="Arial,sans-serif" font-size="22" font-weight="700">2020</text><text x="82" y="425" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">1.02 crore</text><path d="M420 396 H730" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/><path d="M715 378 L738 396 L715 414" fill="none" stroke="#e8c783" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="365" fill="#d8b36d" font-family="Arial,sans-serif" font-size="22" font-weight="700">30 OCTOBER 2026</text><text x="790" y="425" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">10 crore+</text><rect x="80" y="490" width="1040" height="105" rx="16" fill="#fff" opacity=".07" stroke="#d8b36d" stroke-opacity=".45"/><text x="112" y="554" fill="#e8c783" font-family="Arial,sans-serif" font-size="44" font-weight="700">37.8%</text><text x="300" y="551" fill="#fff" font-family="Arial,sans-serif" font-size="25">of registrations are women-led</text><text x="82" y="638" fill="#aebdce" font-family="Arial,sans-serif" font-size="16">Source: Ministry of MSME / Udyam dashboard · November 2026</text></svg>