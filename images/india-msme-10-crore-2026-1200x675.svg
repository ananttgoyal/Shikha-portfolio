<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">India crosses 10 crore MSME registrations</title><desc id="d">Editorial graphic celebrating India's MSME registration milestone and asking what businesses need to do next to grow sustainably.</desc><defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172e"/><stop offset="1" stop-color="#17375b"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bd8b3e"/><stop offset=".5" stop-color="#f4d68c"/><stop offset="1" stop-color="#c18d42"/></linearGradient><linearGradient id="saffron" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f28b24"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs><rect width="1200" height="675" fill="url(#navy)"/><circle cx="1040" cy="170" r="250" fill="#fff" opacity=".035"/><circle cx="1040" cy="170" r="185" fill="none" stroke="#d9b66e" stroke-opacity=".22" stroke-width="2"/><path d="M0 540 Q230 450 420 535 T820 520 T1200 485 V675 H0Z" fill="#0a213e"/><g opacity=".22" fill="#a9bed4"><path d="M760 490V300h48v190zm60 0V250h58v240zm70 0V205h52v285zm65 0V260h58v230zm68 0V180h55v310z"/></g><path d="M845 270L1075 55" stroke="url(#saffron)" stroke-width="18" stroke-linecap="round"/><path d="M1035 60l49-15-15 50" fill="none" stroke="#ffb347" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect x="62" y="46" width="1076" height="78" rx="13" fill="#fff" opacity=".97"/><g transform="translate(86 62)" fill="#17375b"><path d="M0 39h42M7 31h28M13 23h16M18 15h6" stroke="#17375b" stroke-width="3" stroke-linecap="round"/><text x="62" y="24" font-family="Arial,sans-serif" font-size="19" font-weight="700">MINISTRY OF MICRO, SMALL &amp; MEDIUM ENTERPRISES</text><text x="62" y="49" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.5">GOVERNMENT OF INDIA · MSME MILESTONE</text></g><text x="75" y="194" fill="#e8c982" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">A NEW CHAPTER FOR INDIAN ENTREPRENEURSHIP</text><text x="68" y="345" fill="#fff" font-family="Arial,sans-serif" font-size="130" font-weight="800" letter-spacing="-5">10 CRORE+</text><text x="78" y="407" fill="#e8edf4" font-family="Arial,sans-serif" font-size="43" font-weight="700">MSME REGISTRATIONS</text><rect x="78" y="438" width="570" height="7" rx="3.5" fill="url(#gold)"/><text x="80" y="493" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="600">A milestone worth celebrating.</text><text x="80" y="531" fill="#d5e0ec" font-family="Arial,sans-serif" font-size="22">But registration is only the beginning.</text><g transform="translate(720 345)"><rect width="415" height="230" rx="20" fill="#fff" opacity=".97"/><text x="28" y="48" fill="#17375b" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1">THE BIGGER QUESTION</text><text x="28" y="101" fill="#102744" font-family="Arial,sans-serif" font-size="34" font-weight="800">WHAT'S NEXT?</text><text x="28" y="145" fill="#8d642a" font-family="Arial,sans-serif" font-size="23" font-weight="700">Turn registration into</text><text x="28" y="177" fill="#8d642a" font-family="Arial,sans-serif" font-size="23" font-weight="700">real business growth.</text><path d="M28 198H380" stroke="#e0c17b" stroke-width="3"/></g><path d="M0 605H1200" stroke="url(#gold)" stroke-width="3"/><text x="70" y="642" fill="#dce5ef" font-family="Arial,sans-serif" font-size="17" letter-spacing="1">CUSTOMERS · CASH FLOW · CAPABLE TEAMS · STRONGER SYSTEMS</text><text x="1130" y="642" text-anchor="end" fill="#e8c982" font-family="Arial,sans-serif" font-size="16" font-weight="700">SHIKHA SOLUTIONS</text><path d="M0 0h400" stroke="#f28b24" stroke-width="8"/><path d="M400 0h400" stroke="#fff" stroke-width="8"/><path d="M800 0h400" stroke="#168b52" stroke-width="8"/></svg>